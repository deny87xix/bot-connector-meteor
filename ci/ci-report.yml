# ПЕРЕНЕСИТЕ этот файл в .github/workflows/ci-report.yml (коннектор Claude не может писать в .github/workflows).
# Собирает проект, выгружает сигнатуры API и коммитит отчёт обратно в ветку:
#   docs/api-notes.md, docs/ci/last-build.txt
name: CI report (feature/no-reconnect)

on:
  push:
    branches: [feature/no-reconnect]
    paths-ignore:
      - 'docs/ci/**'
      - 'docs/api-notes.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --console=plain 2>&1 | tee build.log
      - name: API signatures
        if: always()
        run: bash ci/api-dump.sh
      - name: Build report
        if: always()
        run: |
          touch build.log
          bash ci/write-report.sh "${{ steps.build.outcome }}"
      - name: Commit report
        if: always()
        run: |
          git config user.name "ci-report"
          git config user.email "ci-report@users.noreply.github.com"
          git add docs/ci docs/api-notes.md
          if ! git diff --cached --quiet; then
            git commit -m "ci: report [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
